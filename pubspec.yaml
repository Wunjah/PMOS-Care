name: pmos_care
description: "PMOS Care: A mobile-first, offline-capable healthcare application for women in Cameroon living with PMOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Firebase Core & SDKs
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2

  # Local Cache & Offline Stores
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1

  # Security & Biometrics
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Preferences
  shared_preferences: ^2.3.5

  # PDF Generation & Sharing
  pdf: ^3.11.3
  share_plus: ^10.1.4
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
